<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Mini GTA — Fixed</title>
<style>
  body { margin:0; overflow:hidden; font-family:'Segoe UI',sans-serif; background:#000; color:#fff; }
  canvas { display:block; }
  #hud { position:fixed; top:15px; left:15px; z-index:10; pointer-events:none;
         text-shadow:0 0 8px #000, 0 0 2px #000; }
  #hud div { margin-bottom:6px; font-size:14px; letter-spacing:1px; }
  #money { color:#7CFC00; font-size:22px; font-weight:bold; }
  #wanted { color:#ff3860; }
  #fps { position:fixed; top:15px; left:50%; transform:translateX(-50%);
         color:#0f0; font-family:monospace; font-size:14px; z-index:10;
         background:rgba(0,0,0,.5); padding:4px 10px; border-radius:4px; }
  #minimap { position:fixed; bottom:15px; left:15px; width:160px; height:160px;
             border:2px solid #ff00aa; border-radius:50%; background:rgba(0,0,0,.6);
             box-shadow:0 0 15px #ff00aa; overflow:hidden; }
  #minimapCanvas { width:100%; height:100%; }
  #controls { position:fixed; bottom:15px; right:15px; background:rgba(0,0,0,.55);
              padding:10px 14px; border:1px solid #00e5ff; border-radius:8px;
              font-size:12px; line-height:1.5; color:#00e5ff; }
  #controls b { color:#fff; }
  #title { position:fixed; top:15px; right:15px; font-size:26px; font-weight:bold;
           color:#ff00aa; text-shadow:0 0 12px #ff00aa, 2px 2px 0 #00e5ff; letter-spacing:3px; }
  #msg { position:fixed; top:45%; left:50%; transform:translate(-50%,-50%);
         font-size:20px; color:#ffeb3b; text-shadow:0 0 10px #000;
         opacity:0; transition:opacity .3s; pointer-events:none; }
  #error { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
           background:#300; color:#f88; padding:20px; border:2px solid #f00;
           border-radius:8px; font-family:monospace; max-width:80%; display:none; z-index:100; }
</style>
</head>
<body>
<div id="title">VICE CITY</div>
<div id="fps">FPS: --</div>
<div id="hud">
  <div id="money">$ 50 000</div>
  <div id="health">❤️ 100</div>
  <div id="wanted">⭐ Wanted: 0</div>
  <div id="speed">🚗 0 km/h</div>
</div>
<div id="minimap"><canvas id="minimapCanvas" width="160" height="160"></canvas></div>
<div id="controls">
  <b>WASD</b> — движение<br>
  <b>SHIFT</b> — бег/турбо<br>
  <b>SPACE</b> — прыжок/ручник<br>
  <b>F</b> — сесть/выйти<br>
  <b>Мышь</b> — камера (клик)
</div>
<div id="msg"></div>
<div id="error"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" }}
</script>
<script type="module">
import * as THREE from 'three';

window.onerror = (msg, src, line) => {
  const e = document.getElementById('error');
  e.style.display = 'block';
  e.textContent = `Ошибка: ${msg}\nСтрока: ${line}`;
};

try {

// ---------- РЕНДЕР ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a0a2e);
scene.fog = new THREE.Fog(0x1a0a2e, 60, 250);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.5, 400);
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
document.body.appendChild(renderer.domElement);

// ---------- СВЕТ ----------
scene.add(new THREE.HemisphereLight(0xff88cc, 0x2233aa, 0.7));
const sun = new THREE.DirectionalLight(0xffaa66, 1.0);
sun.position.set(80, 120, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -100; sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100; sun.shadow.camera.bottom = -100;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 300;
scene.add(sun);

// ---------- НЕБО ----------
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(350, 16, 10),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false,
    uniforms: { top:{value:new THREE.Color(0x0a0530)}, bottom:{value:new THREE.Color(0xff4488)} },
    vertexShader:`varying vec3 v; void main(){ v=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader:`uniform vec3 top,bottom; varying vec3 v;
      void main(){ gl_FragColor=vec4(mix(bottom,top,normalize(v).y*.5+.5),1.); }`
  })
);
scene.add(sky);

// ---------- ЗЕМЛЯ ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 600),
  new THREE.MeshStandardMaterial({ color:0x1a1a2e, roughness:1 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- ГОРОД ----------
const ROAD_W = 12, BLOCK = 40, GRID = 5;
const cityGroup = new THREE.Group();
scene.add(cityGroup);

// Дороги — отдельные меши (их всего ~22, не критично)
const roadMat = new THREE.MeshStandardMaterial({ color:0x222233, roughness:0.8 });
for (let i=-GRID; i<=GRID; i++){
  const rh = new THREE.Mesh(new THREE.PlaneGeometry(GRID*2*BLOCK+ROAD_W, ROAD_W), roadMat);
  rh.rotation.x = -Math.PI/2; rh.position.set(0, 0.02, i*BLOCK);
  cityGroup.add(rh);
  const rv = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, GRID*2*BLOCK+ROAD_W), roadMat);
  rv.rotation.x = -Math.PI/2; rv.position.set(i*BLOCK, 0.02, 0);
  cityGroup.add(rv);
}

// Разметка — InstancedMesh (один draw call на всю разметку!)
const lineGeo = new THREE.PlaneGeometry(1, 1);
const lineMat = new THREE.MeshBasicMaterial({ color:0xffdd44 });
const linePositions = [];
for (let i=-GRID; i<=GRID; i++){
  for (let k=-GRID*BLOCK; k<GRID*BLOCK; k+=6){
    linePositions.push({ x:k+1.25, z:i*BLOCK, sx:2.5, sz:0.3, ry:0 });
    linePositions.push({ x:i*BLOCK, z:k+1.25, sx:0.3, sz:2.5, ry:0 });
  }
}
const lineInst = new THREE.InstancedMesh(lineGeo, lineMat, linePositions.length);
const dummy = new THREE.Object3D();
linePositions.forEach((p, i) => {
  dummy.position.set(p.x, 0.04, p.z);
  dummy.rotation.set(-Math.PI/2, 0, 0);
  dummy.scale.set(p.sx, p.sz, 1);
  dummy.updateMatrix();
  lineInst.setMatrixAt(i, dummy.matrix);
});
cityGroup.add(lineInst);

// Здания — InstancedMesh по цветам
const buildings = [];
const palette = [0x2a3a5a, 0x4a2a5a, 0x5a2a4a, 0x3a4a6a, 0x6a3a5a];
const buildingData = palette.map(() => []);
const windowPositions = [];

for (let x=-GRID; x<GRID; x++){
  for (let z=-GRID; z<GRID; z++){
    const cx = x*BLOCK + BLOCK/2;
    const cz = z*BLOCK + BLOCK/2;
    const n = 1 + Math.floor(Math.random()*2);
    for (let i=0; i<n; i++){
      const w = 8 + Math.random()*10;
      const d = 8 + Math.random()*10;
      const h = 12 + Math.random()*40;
      const bx = cx + (Math.random()-0.5)*(BLOCK-ROAD_W-w);
      const bz = cz + (Math.random()-0.5)*(BLOCK-ROAD_W-d);
      const colIdx = Math.floor(Math.random()*palette.length);
      buildingData[colIdx].push({ x:bx, y:h/2, z:bz, w, h, d });
      buildings.push({ x:bx, z:bz, w, d });

      // Окна
      const rows = Math.floor(h/3.5), cols = Math.floor(Math.min(w,d)/3);
      for (let r=0; r<rows; r++){
        for (let c=0; c<cols; c++){
          if (Math.random()<0.5) continue;
          const wy = 2 + r*3.5;
          const side = Math.floor(Math.random()*4);
          let wx, wz, ry=0;
          if (side===0){ wx = bx - w/2 - 0.05; wz = bz - d/2 + c*3 + 1.5; ry = -Math.PI/2; }
          else if (side===1){ wx = bx + w/2 + 0.05; wz = bz - d/2 + c*3 + 1.5; ry = Math.PI/2; }
          else if (side===2){ wx = bx - w/2 + c*3 + 1.5; wz = bz - d/2 - 0.05; }
          else { wx = bx - w/2 + c*3 + 1.5; wz = bz + d/2 + 0.05; ry = Math.PI; }
          windowPositions.push({ x:wx, y:wy, z:wz, ry });
        }
      }
    }
  }
}

// Создаём InstancedMesh для каждого цвета зданий
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const buildMat = new THREE.MeshStandardMaterial({ roughness:0.6 });
palette.forEach((col, idx) => {
  const data = buildingData[idx];
  if (!data.length) return;
  const mat = buildMat.clone();
  mat.color = new THREE.Color(col);
  const inst = new THREE.InstancedMesh(boxGeo, mat, data.length);
  inst.castShadow = true;
  inst.receiveShadow = true;
  data.forEach((b, i) => {
    dummy.position.set(b.x, b.y, b.z);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.set(b.w, b.h, b.d);
    dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
  });
  cityGroup.add(inst);
});

// Окна — один InstancedMesh
const winGeo = new THREE.PlaneGeometry(1, 1);
const winMat = new THREE.MeshBasicMaterial({ color:0xffee88 });
const winInst = new THREE.InstancedMesh(winGeo, winMat, windowPositions.length);
windowPositions.forEach((p, i) => {
  dummy.position.set(p.x, p.y, p.z);
  dummy.rotation.set(0, p.ry, 0);
  dummy.scale.set(0.9, 1.3, 1);
  dummy.updateMatrix();
  winInst.setMatrixAt(i, dummy.matrix);
});
cityGroup.add(winInst);

// Пальмы — InstancedMesh
const palmCount = 20;
const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 6, 6);
const trunkMat = new THREE.MeshStandardMaterial({ color:0x6b4423 });
const trunkInst = new THREE.InstancedMesh(trunkGeo, trunkMat, palmCount);
const leafGeo = new THREE.ConeGeometry(1.3, 2.5, 4);
const leafMat = new THREE.MeshStandardMaterial({ color:0x2a7a3a });
const leafInst = new THREE.InstancedMesh(leafGeo, leafMat, palmCount * 5);
let leafIdx = 0;
for (let i=0; i<palmCount; i++){
  const px = (Math.random()-0.5)*GRID*2*BLOCK;
  const pz = (Math.random()-0.5)*GRID*2*BLOCK;
  dummy.position.set(px, 3, pz);
  dummy.rotation.set(0, 0, 0);
  dummy.scale.set(1, 1, 1);
  dummy.updateMatrix();
  trunkInst.setMatrixAt(i, dummy.matrix);
  for (let k=0; k<5; k++){
    const a = k/5 * Math.PI*2;
    dummy.position.set(px + Math.cos(a)*0.8, 6.5, pz + Math.sin(a)*0.8);
    dummy.rotation.set(Math.sin(a)*0.9, 0, Math.cos(a)*0.9);
    dummy.scale.set(1, 1, 1);
    dummy.updateMatrix();
    leafInst.setMatrixAt(leafIdx++, dummy.matrix);
  }
}
cityGroup.add(trunkInst);
cityGroup.add(leafInst);

// Фонари
const lampGeo = new THREE.CylinderGeometry(0.1, 0.1, 6, 6);
const lampMat = new THREE.MeshStandardMaterial({ color:0x333 });
const lampBulbGeo = new THREE.SphereGeometry(0.3, 8, 6);
const lampBulbMat = new THREE.MeshBasicMaterial({ color:0xff66aa });
for (let i=-GRID; i<=GRID; i+=2){
  for (let j=-GRID; j<=GRID; j+=2){
    const lx = i*BLOCK + BLOCK/2, lz = j*BLOCK + BLOCK/2;
    const pole = new THREE.Mesh(lampGeo, lampMat);
    pole.position.set(lx, 3, lz);
    cityGroup.add(pole);
    const bulb = new THREE.Mesh(lampBulbGeo, lampBulbMat);
    bulb.position.set(lx, 6, lz);
    cityGroup.add(bulb);
    if ((i+j) % 4 === 0){
      const pl = new THREE.PointLight(0xff66aa, 1.2, 20, 2);
      pl.position.set(lx, 6, lz);
      cityGroup.add(pl);
    }
  }
}

// ---------- МАШИНА ----------
function createCar(color=0xff2266, withLights=true){
  const car = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2, 0.8, 4.5),
    new THREE.MeshStandardMaterial({ color, metalness:0.6, roughness:0.4 })
  );
  body.position.y = 0.7;
  body.castShadow = withLights;
  car.add(body);
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 0.7, 2.2),
    new THREE.MeshStandardMaterial({ color:0x111122, metalness:0.8, roughness:0.2 })
  );
  cabin.position.set(0, 1.4, -0.2);
  car.add(cabin);
  const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 10);
  const wheelMat = new THREE.MeshStandardMaterial({ color:0x111 });
  const wheels = [];
  [[-1,0.4,1.5],[1,0.4,1.5],[-1,0.4,-1.5],[1,0.4,-1.5]].forEach(p=>{
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI/2;
    w.position.set(p[0], p[1], p[2]);
    car.add(w);
    wheels.push(w);
  });
  const hlMat = new THREE.MeshBasicMaterial({ color:0xffffcc });
  [[-0.7,0.7,2.26],[0.7,0.7,2.26]].forEach(p=>{
    const h = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 6), hlMat);
    h.position.set(p[0], p[1], p[2]);
    car.add(h);
  });
  car.userData.wheels = wheels;

  if (withLights){
    const hl = new THREE.SpotLight(0xffffcc, 2, 25, Math.PI/5, 0.5);
    hl.position.set(0, 0.8, 2.3);
    hl.target.position.set(0, 0, 10);
    car.add(hl);
    car.add(hl.target);
  }
  return car;
}

const playerCar = createCar(0xff2266, true);
playerCar.position.set(6, 0, 6);
scene.add(playerCar);

// ---------- ИГРОК ----------
const player = new THREE.Group();
const pBody = new THREE.Mesh(new THREE.BoxGeometry(0.6,1.2,0.4), new THREE.MeshStandardMaterial({color:0x44aaff}));
pBody.position.y = 1.2;
player.add(pBody);
const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.25,10,8), new THREE.MeshStandardMaterial({color:0xffccaa}));
pHead.position.y = 2.05;
player.add(pHead);
const pLegs = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.8,0.35), new THREE.MeshStandardMaterial({color:0x222244}));
pLegs.position.y = 0.4;
player.add(pLegs);
player.position.set(10, 0, 10);
player.visible = false;
scene.add(player);

// ---------- NPC МАШИНЫ ----------
const npcCars = [];
const npcColors = [0x22ccff, 0xffcc22, 0x22ff66, 0xaa22ff, 0xffffff];
for (let i=0; i<8; i++){
  const c = createCar(npcColors[i%5], false);
  const road = Math.floor(Math.random()*(GRID*2+1)) - GRID;
  const horiz = Math.random()<0.5;
  if (horiz){
    c.position.set((Math.random()-0.5)*GRID*2*BLOCK, 0, road*BLOCK + (Math.random()<0.5?3:-3));
    c.rotation.y = Math.random()<0.5 ? 0 : Math.PI;
    c.userData.dir = new THREE.Vector3(Math.cos(c.rotation.y),0,-Math.sin(c.rotation.y));
  } else {
    c.position.set(road*BLOCK + (Math.random()<0.5?3:-3), 0, (Math.random()-0.5)*GRID*2*BLOCK);
    c.rotation.y = Math.random()<0.5 ? Math.PI/2 : -Math.PI/2;
    c.userData.dir = new THREE.Vector3(Math.sin(c.rotation.y),0,Math.cos(c.rotation.y));
  }
  c.userData.speed = 8 + Math.random()*5;
  scene.add(c);
  npcCars.push(c);
}

// ---------- NPC ПЕШЕХОДЫ ----------
const npcs = [];
for (let i=0; i<12; i++){
  const n = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.5,1.1,0.35), new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(Math.random(),0.6,0.5)}));
  b.position.y = 1.15;
  n.add(b);
  const h = new THREE.Mesh(new THREE.SphereGeometry(0.22,8,6), new THREE.MeshStandardMaterial({color:0xffccaa}));
  h.position.y = 1.95;
  n.add(h);
  n.position.set((Math.random()-0.5)*150, 0, (Math.random()-0.5)*150);
  n.userData.speed = 1 + Math.random()*1.5;
  n.userData.angle = Math.random()*Math.PI*2;
  scene.add(n);
  npcs.push(n);
}

// ---------- УПРАВЛЕНИЕ ----------
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);

let yaw = 0, pitch = -0.2, pointerLocked = false;
renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange', () => pointerLocked = document.pointerLockElement === renderer.domElement);
addEventListener('mousemove', e => {
  if (!pointerLocked) return;
  yaw -= e.movementX * 0.0025;
  pitch -= e.movementY * 0.0025;
  pitch = Math.max(-1.2, Math.min(0.6, pitch));
});

let inCar = true, carVel = 0;
let playerVelY = 0, onGround = true;
let money = 50000, health = 100, wanted = 0;
const msgEl = document.getElementById('msg');
function showMsg(t){
  msgEl.textContent = t;
  msgEl.style.opacity = 1;
  clearTimeout(showMsg._t);
  showMsg._t = setTimeout(()=>msgEl.style.opacity=0, 2000);
}

function collideBuildings(x, z, r=1.5){
  for (const b of buildings){
    if (Math.abs(x-b.x) < b.w/2+r && Math.abs(z-b.z) < b.d/2+r) return true;
  }
  return false;
}

// ---------- МИНИ-КАРТА ----------
const mmCanvas = document.getElementById('minimapCanvas');
const mmCtx = mmCanvas.getContext('2d');
function drawMinimap(){
  mmCtx.clearRect(0,0,160,160);
  mmCtx.fillStyle = 'rgba(20,10,40,0.8)';
  mmCtx.fillRect(0,0,160,160);
  const scale = 0.45;
  const px = inCar ? playerCar.position.x : player.position.x;
  const pz = inCar ? playerCar.position.z : player.position.z;
  mmCtx.strokeStyle = '#444';
  mmCtx.lineWidth = 2;
  for (let i=-GRID; i<=GRID; i++){
    mmCtx.beginPath();
    mmCtx.moveTo(80 + (-GRID*BLOCK - px)*scale, 80 + (i*BLOCK - pz)*scale);
    mmCtx.lineTo(80 + (GRID*BLOCK - px)*scale, 80 + (i*BLOCK - pz)*scale);
    mmCtx.stroke();
    mmCtx.beginPath();
    mmCtx.moveTo(80 + (i*BLOCK - px)*scale, 80 + (-GRID*BLOCK - pz)*scale);
    mmCtx.lineTo(80 + (i*BLOCK - px)*scale, 80 + (GRID*BLOCK - pz)*scale);
    mmCtx.stroke();
  }
  mmCtx.fillStyle = '#00e5ff';
  npcCars.forEach(c=>{
    const dx = (c.position.x - px)*scale, dz = (c.position.z - pz)*scale;
    if (Math.abs(dx)<80 && Math.abs(dz)<80) mmCtx.fillRect(80+dx-2, 80+dz-2, 4, 4);
  });
  mmCtx.save();
  mmCtx.translate(80, 80);
  mmCtx.rotate(inCar ? -playerCar.rotation.y : -yaw);
  mmCtx.fillStyle = '#ff00aa';
  mmCtx.beginPath();
  mmCtx.moveTo(0,-6);
  mmCtx.lineTo(-4,5);
  mmCtx.lineTo(4,5);
  mmCtx.closePath();
  mmCtx.fill();
  mmCtx.restore();
}

// ---------- FPS ----------
let frames = 0, fpsTime = 0;
const fpsEl = document.getElementById('fps');

// ---------- ЦИКЛ ----------
const clock = new THREE.Clock();
const camTarget = new THREE.Vector3();
const camPos = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  frames++;
  fpsTime += dt;
  if (fpsTime >= 0.5){
    fpsEl.textContent = `FPS: ${Math.round(frames/fpsTime)}`;
    frames = 0;
    fpsTime = 0;
  }

  if (inCar){
    const accel = keys['KeyW'] ? 25 : (keys['KeyS'] ? -18 : 0);
    const turbo = keys['ShiftLeft'] ? 1.5 : 1;
    carVel += accel * dt * turbo;
    carVel *= 0.985;
    if (keys['Space']) carVel *= 0.95;
    carVel = Math.max(-20, Math.min(50*turbo, carVel));

    const steerInput = (keys['KeyA']?1:0) - (keys['KeyD']?1:0);
    const steerFactor = Math.min(1, Math.abs(carVel)/5);
    playerCar.rotation.y += steerInput * 1.8 * dt * steerFactor * Math.sign(carVel || 1);

    const nx = playerCar.position.x + Math.sin(playerCar.rotation.y) * carVel * dt;
    const nz = playerCar.position.z + Math.cos(playerCar.rotation.y) * carVel * dt;
    if (!collideBuildings(nx, nz, 2.2)){
      playerCar.position.x = nx;
      playerCar.position.z = nz;
    } else carVel *= -0.3;

    playerCar.userData.wheels.forEach((w,i)=>{
      w.rotation.x += carVel * dt * 2;
      if (i<2) w.rotation.y = steerInput * 0.4;
    });

    const camDist = 9, camH = 4;
    camPos.set(
      playerCar.position.x - Math.sin(yaw)*Math.cos(pitch)*camDist,
      playerCar.position.y + camH - Math.sin(pitch)*camDist,
      playerCar.position.z - Math.cos(yaw)*Math.cos(pitch)*camDist
    );
    camTarget.set(playerCar.position.x, playerCar.position.y+1, playerCar.position.z);
    camera.position.lerp(camPos, 0.15);
    camera.lookAt(camTarget);

    document.getElementById('speed').textContent = `🚗 ${Math.abs(Math.round(carVel*3.6))} km/h`;

    if (keys['KeyF']){
      keys['KeyF'] = false;
      inCar = false;
      player.visible = true;
      player.position.set(playerCar.position.x + 2.5, 0, playerCar.position.z);
      showMsg('Вышел из машины');
    }
  } else {
    const speed = (keys['ShiftLeft'] ? 9 : 4);
    const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const move = new THREE.Vector3();
    if (keys['KeyW']) move.add(forward);
    if (keys['KeyS']) move.sub(forward);
    if (keys['KeyD']) move.add(right);
    if (keys['KeyA']) move.sub(right);
    if (move.lengthSq()>0) move.normalize().multiplyScalar(speed*dt);

    const nx = player.position.x + move.x;
    const nz = player.position.z + move.z;
    if (!collideBuildings(nx, nz, 0.5)){
      player.position.x = nx;
      player.position.z = nz;
    }

    if (keys['Space'] && onGround){ playerVelY = 7; onGround = false; }
    playerVelY -= 18*dt;
    player.position.y += playerVelY*dt;
    if (player.position.y <= 0){ player.position.y = 0; playerVelY = 0; onGround = true; }

    const camDist = 5, camH = 2;
    camera.position.set(
      player.position.x - Math.sin(yaw)*Math.cos(pitch)*camDist,
      player.position.y + camH - Math.sin(pitch)*camDist,
      player.position.z - Math.cos(yaw)*Math.cos(pitch)*camDist
    );
    camera.lookAt(player.position.x, player.position.y+1.5, player.position.z);

    document.getElementById('speed').textContent = `🚶 ${move.lengthSq()>0 ? speed*3.6|0 : 0} km/h`;

    if (keys['KeyF']){
      keys['KeyF'] = false;
      if (player.position.distanceTo(playerCar.position) < 4){
        inCar = true;
        player.visible = false;
        showMsg('Сел в машину');
      } else showMsg('Подойди ближе к машине');
    }
  }

  npcCars.forEach(c=>{
    c.position.addScaledVector(c.userData.dir, c.userData.speed*dt);
    c.userData.wheels.forEach(w=>w.rotation.x += c.userData.speed*dt*2);
    if (Math.abs(c.position.x) > GRID*BLOCK || Math.abs(c.position.z) > GRID*BLOCK)
      c.position.multiplyScalar(-0.5);
  });

  npcs.forEach(n=>{
    n.position.x += Math.cos(n.userData.angle)*n.userData.speed*dt;
    n.position.z += Math.sin(n.userData.angle)*n.userData.speed*dt;
    n.rotation.y = -n.userData.angle + Math.PI/2;
    if (Math.random()<0.01) n.userData.angle += (Math.random()-0.5)*1.5;
    if (Math.abs(n.position.x)>150 || Math.abs(n.position.z)>150) n.userData.angle += Math.PI;
  });

  const dayT = (Math.sin(t*0.05)+1)/2;
  sun.intensity = 0.4 + dayT*1.0;
  scene.fog.color.setHSL(0.8, 0.5, 0.05 + dayT*0.15);
  scene.background.copy(scene.fog.color);

  document.getElementById('health').textContent = `❤️ ${health}`;
  document.getElementById('money').textContent = `$ ${money.toLocaleString('ru-RU')}`;
  document.getElementById('wanted').textContent = `⭐ Wanted: ${wanted}`;

  drawMinimap();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

showMsg('Добро пожаловать в Vice City! Кликни для захвата мыши.');

} catch(err) {
  const e = document.getElementById('error');
  e.style.display = 'block';
  e.textContent = `Ошибка: ${err.message}\n\nСтек:\n${err.stack}`;
  console.error(err);
}
</script>
</body>
</html>
